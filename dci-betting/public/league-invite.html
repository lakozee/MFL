<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join League - Marching Fantasy League</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script src="/api.js"></script>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Join League</h1>
                <p class="auth-subtitle" id="statusMessage">Processing your invitation...</p>
            </div>

            <div id="loading" class="loading-spinner">
                <div class="spinner"></div>
            </div>

            <div id="error" class="error-message" style="display: none;"></div>
        </div>
    </div>

    <script>
        const token = window.location.pathname.split('/invite/')[1];

        async function processInvite() {
            try {
                // Check if user is logged in
                const user = await api.verifySession();

                if (!user) {
                    // Not logged in - redirect to auth with return URL
                    window.location.href = `/auth?redirect=/invite/${token}`;
                    return;
                }

                // User is logged in - join the league
                document.getElementById('statusMessage').textContent = 'Joining league...';

                const result = await api.request(`/leagues/join/${token}`, {
                    method: 'POST'
                });

                // Success! Redirect to league page
                window.location.href = `/league/${result.leagueId}`;

            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = error.message || 'Failed to join league. The invite may be expired or invalid.';
            }
        }

        processInvite();
    </script>

    <style>
        .loading-spinner {
            text-align: center;
            padding: var(--spacing-2xl);
        }

        .spinner {
            border: 4px solid rgba(99, 102, 241, 0.1);
            border-radius: 50%;
            border-top: 4px solid var(--color-accent-primary);
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</body>

</html>
