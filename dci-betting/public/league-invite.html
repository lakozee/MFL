<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Join League - Marching Fantasy League</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script src="/api.js"></script>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Join League</h1>
                <p class="auth-subtitle" id="statusMessage">Processing your invitation...</p>
            </div>

            <div id="loading" class="loading-spinner">
                <div class="spinner"></div>
            </div>

            <div id="error" class="error-message" style="display: none;"></div>

            <div id="blockedBox" class="blocked-box" style="display: none;">
                <p id="blockedTitle" class="blocked-title"></p>
                <p id="blockedMsg" class="blocked-msg"></p>
                <div class="blocked-actions">
                    <a href="/settings" class="btn btn-secondary" id="blockedSettingsLink" style="display:none;">Account Settings</a>
                    <a href="/app" class="btn btn-primary">Go to My League</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = window.location.pathname.split('/invite/')[1];

        function showBlocked({ title, message, showSettingsLink }) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('statusMessage').textContent = 'Unable to join league';
            document.getElementById('blockedBox').style.display = 'block';
            document.getElementById('blockedTitle').textContent = title;
            document.getElementById('blockedMsg').textContent = message;
            if (showSettingsLink) {
                document.getElementById('blockedSettingsLink').style.display = 'inline-block';
            }
        }

        async function processInvite() {
            try {
                // Check if user is logged in
                const user = await api.verifySession();

                if (!user) {
                    // Not logged in - redirect to auth with return URL
                    window.location.href = `/auth?redirect=/invite/${token}`;
                    return;
                }

                // User is logged in - join the league
                document.getElementById('statusMessage').textContent = 'Joining league...';

                const result = await api.request(`/leagues/join/${token}`, {
                    method: 'POST'
                });

                // Success! Redirect to league page
                window.location.href = `/league/${result.leagueId}`;

            } catch (error) {
                const msg = (error.message || '').toLowerCase();

                if (msg.includes('already in a league')) {
                    showBlocked({
                        title: 'You are already in a league',
                        message: 'To join this league, leave your current league in Account Settings first.',
                        showSettingsLink: true
                    });
                    return;
                }

                if (msg.includes('kicked')) {
                    showBlocked({
                        title: 'You were kicked from this league',
                        message: 'You can\'t use this invite right now.',
                        showSettingsLink: false
                    });
                    return;
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = error.message || 'Failed to join league. The invite may be expired or invalid.';
            }
        }

        processInvite();
    </script>

    <style>
        .blocked-box {
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 1rem;
            text-align: center;
        }

        .blocked-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fca5a5;
            margin: 0 0 0.5rem;
        }

        .blocked-msg {
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.92rem;
            margin: 0 0 1.25rem;
            line-height: 1.5;
        }

        .blocked-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .blocked-actions .btn {
            padding: 0.55rem 1.1rem;
            font-size: 0.88rem;
        }

        .loading-spinner {
            text-align: center;
            padding: var(--spacing-2xl);
        }

        .spinner {
            border: 4px solid rgba(99, 102, 241, 0.1);
            border-radius: 50%;
            border-top: 4px solid var(--color-accent-primary);
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>

    <footer style="text-align:center;padding:1.5rem;">
        <a href="/terms" style="color:rgba(255,255,255,0.35);font-size:0.8rem;text-decoration:none;">Terms of Service</a>
    </footer>
</body>

</html>
